[build]
  command = "bun run build"
  publish = "dist"
  # SUPABASE_URL and VITE_SUPABASE_URL hold the same value (the Supabase
  # project URL). It's not a credential -- every Supabase browser client
  # needs it -- but Netlify's secret scanner flags SUPABASE_URL as secret
  # and matches by value, so it fires on the intentional VITE_SUPABASE_URL
  # occurrence in the client bundle. Omit it from scanning.
  environment = { SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL" }

# The app is served from /alin (see vite.config.ts "base"); "/" is the static
# holding page. These keep old/printed URLs working by rewriting them into /alin.
[[redirects]]
  from = "/b/*"
  to = "/alin/b/:splat"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/alin/mcp"
  status = 200

[[redirects]]
  from = "/.mcp/*"
  to = "/alin/.mcp/:splat"
  status = 200

[[redirects]]
  from = "/.well-known/*"
  to = "/alin/.well-known/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/alin/admin"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/alin/admin/:splat"
  status = 301

[[redirects]]
  from = "/auth"
  to = "/alin/auth"
  status = 301

[[redirects]]
  from = "/reset-password"
  to = "/alin/reset-password"
  status = 301
